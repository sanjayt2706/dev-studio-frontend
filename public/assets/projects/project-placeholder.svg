<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="p-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#111528"/>
      <stop offset="100%" stop-color="#080912"/>
    </linearGradient>
    <linearGradient id="p-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <radialGradient id="p-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3"/>
      <stop offset="70%" stop-color="#1d4ed8" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="1600" height="900" fill="url(#p-bg)"/>
  <circle cx="800" cy="450" r="500" fill="url(#p-glow)"/>

  <!-- Tech Matrix Grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="150" x2="1600" y2="150"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/>
    <line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/>
    <line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/>
    <line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/>
    <line x1="1200" y1="0" x2="1200" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>

  <!-- Terminal Window Mockup -->
  <g transform="translate(450, 240)">
    <rect width="700" height="420" rx="12" fill="#0d111e" stroke="#3b82f6" stroke-opacity="0.4" stroke-width="1.5"/>
    
    <!-- Window Bar -->
    <rect width="700" height="46" rx="12" fill="#161c33"/>
    <circle cx="28" cy="23" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="48" cy="23" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="68" cy="23" r="6" fill="#10b981" opacity="0.8"/>
    <text x="350" y="28" font-family="'JetBrains Mono', monospace, sans-serif" font-size="12" fill="#94a3b8" text-anchor="middle" letter-spacing="1">dev-studio://workspace/build.tsx</text>

    <!-- Code Wireframe Lines -->
    <g transform="translate(40, 90)">
      <rect x="0" y="0" width="120" height="12" rx="4" fill="#38bdf8" opacity="0.7"/>
      <rect x="135" y="0" width="180" height="12" rx="4" fill="#818cf8" opacity="0.5"/>

      <rect x="30" y="32" width="220" height="10" rx="3" fill="#64748b" opacity="0.4"/>
      <rect x="265" y="32" width="140" height="10" rx="3" fill="#a78bfa" opacity="0.6"/>

      <rect x="30" y="60" width="160" height="10" rx="3" fill="#64748b" opacity="0.4"/>
      <rect x="205" y="60" width="90" height="10" rx="3" fill="#38bdf8" opacity="0.6"/>

      <rect x="30" y="88" width="300" height="10" rx="3" fill="#64748b" opacity="0.3"/>

      <rect x="60" y="120" width="180" height="10" rx="3" fill="#34d399" opacity="0.6"/>
      <rect x="255" y="120" width="160" height="10" rx="3" fill="#64748b" opacity="0.3"/>

      <rect x="60" y="148" width="240" height="10" rx="3" fill="#f43f5e" opacity="0.5"/>

      <rect x="30" y="180" width="80" height="10" rx="3" fill="#818cf8" opacity="0.5"/>
      <rect x="0" y="210" width="50" height="12" rx="4" fill="#38bdf8" opacity="0.7"/>
    </g>

    <!-- Glowing Corner Stamp -->
    <rect x="490" y="340" width="180" height="50" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-opacity="0.5" stroke-width="1"/>
    <text x="580" y="370" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" font-weight="bold" fill="#38bdf8" text-anchor="middle" letter-spacing="2">PROJECT READY</text>
  </g>
</svg>
