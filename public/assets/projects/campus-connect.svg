  <rect x="115" y="520" width="190" height="110" rx="8" fill="#181B26" stroke="rgba(255,255,255,0.05)"/>
  <text x="130" y="545" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(255,255,255,0.4)">PEERS ONLINE</text>
  <text x="130" y="575" font-family="'Outfit', sans-serif" font-size="26" font-weight="800" fill="#FFFFFF">1,482</text>
  <text x="130" y="605" font-family="'JetBrains Mono', monospace" font-size="9" fill="#10B981">▲ 14% peak campus traffic</text>

