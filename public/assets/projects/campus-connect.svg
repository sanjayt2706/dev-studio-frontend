  <!-- Feed Card 1 -->
  <rect x="360" y="165" width="460" height="135" rx="8" fill="#191D2B" stroke="rgba(59,130,246,0.3)"/>
  <circle cx="390" cy="195" r="16" fill="#3B82F6"/>
  <text x="390" y="200" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">DS</text>
  <text x="420" y="195" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Dev Studio HackSprint '26</text>
  <text x="420" y="210" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(255,255,255,0.4)">MITE Campus Auditorium • 2m ago</text>
  <text x="390" y="245" font-family="'Inter', sans-serif" font-size="12" fill="rgba(255,255,255,0.8)" width="400">48-hour collaborative engineering hackathon registration is now open to all departments.</text>
  <rect x="390" y="265" width="90" height="22" rx="4" fill="rgba(59,130,246,0.2)"/>
  <text x="435" y="280" font-family="'JetBrains Mono', monospace" font-size="10" fill="#60A5FA" text-anchor="middle">REGISTER NOW</text>

  <!-- Feed Card 2 -->
  <rect x="360" y="320" width="460" height="120" rx="8" fill="#161924" stroke="rgba(255,255,255,0.04)"/>
  <circle cx="390" cy="350" r="16" fill="#8B5CF6"/>
  <text x="390" y="355" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">CC</text>
  <text x="420" y="350" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">Campus Connect WebSockets Live</text>
  <text x="420" y="365" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(255,255,255,0.4)">Cluster-03 • Realtime Broadcast</text>
  <text x="390" y="400" font-family="'Inter', sans-serif" font-size="12" fill="rgba(255,255,255,0.7)">Low-latency campus messaging gateway deployed across college Wi-Fi subnets.</text>

  <!-- Feed Card 3 -->
  <rect x="360" y="460" width="460" height="110" rx="8" fill="#161924" stroke="rgba(255,255,255,0.04)"/>
  <circle cx="390" cy="490" r="16" fill="#10B981"/>
  <text x="390" y="495" font-family="'Outfit', sans-serif" font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">ML</text>
  <text x="420" y="490" font-family="'Outfit', sans-serif" font-size="14" font-weight="700" fill="#FFFFFF">AI &amp; Web3 Workshop Series</text>
  <text x="420" y="505" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(255,255,255,0.4)">CS Lab 4 • Friday 4:00 PM</text>

  <!-- Right Panel / Map & Analytics -->
  <rect x="860" y="140" width="240" height="510" rx="8" fill="#131620" stroke="rgba(255,255,255,0.05)"/>
  <text x="880" y="175" font-family="'JetBrains Mono', monospace" font-size="11" fill="#A78BFA" font-weight="700" letter-spacing="1">MITE SPATIAL NODES</text>
  
  <!-- Mini Campus Map Schematic -->
  <rect x="880" y="195" width="200" height="180" rx="8" fill="#0C0E14" stroke="rgba(255,255,255,0.08)"/>
  <circle cx="950" cy="270" r="30" fill="rgba(59,130,246,0.15)" stroke="#3B82F6" stroke-dasharray="3 3"/>
  <circle cx="950" cy="270" r="4" fill="#3B82F6"/>
  <text x="950" y="295" font-family="'JetBrains Mono', monospace" font-size="9" fill="#93C5FD" text-anchor="middle">Main Academic</text>
  
  <circle cx="1020" cy="240" r="22" fill="rgba(139,92,246,0.15)" stroke="#8B5CF6"/>
  <circle cx="1020" cy="240" r="4" fill="#8B5CF6"/>
  <text x="1020" y="260" font-family="'JetBrains Mono', monospace" font-size="9" fill="#C4B5FD" text-anchor="middle">Dev Lab</text>

  <circle cx="920" cy="330" r="18" fill="rgba(16,185,129,0.15)" stroke="#10B981"/>
  <circle cx="920" cy="330" r="4" fill="#10B981"/>
  <text x="920" y="348" font-family="'JetBrains Mono', monospace" font-size="9" fill="#6EE7B7" text-anchor="middle">Auditorium</text>

  <line x1="950" y1="270" x2="1020" y2="240" stroke="rgba(59,130,246,0.5)" stroke-width="1.5" stroke-dasharray="2 2"/>
  <line x1="950" y1="270" x2="920" y2="330" stroke="rgba(16,185,129,0.5)" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- System Metrics Box -->
  <rect x="880" y="395" width="200" height="235" rx="8" fill="#181B26"/>
  <text x="900" y="425" font-family="'JetBrains Mono', monospace" font-size="10" fill="rgba(255,255,255,0.4)">TELEMETRY</text>
  <text x="900" y="450" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF">Latency: <tspan fill="#34D399">12ms</tspan></text>
  <text x="900" y="475" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF">Throughput: <tspan fill="#60A5FA">4.2k msg/s</tspan></text>
  <text x="900" y="500" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FFFFFF">Uptime: <tspan fill="#FBBF24">99.98%</tspan></text>
  
  <!-- Mini Bar Chart -->
  <rect x="900" y="550" width="12" height="40" rx="2" fill="#3B82F6"/>
  <rect x="920" y="535" width="12" height="55" rx="2" fill="#3B82F6"/>
  <rect x="940" y="520" width="12" height="70" rx="2" fill="#8B5CF6"/>
  <rect x="960" y="540" width="12" height="50" rx="2" fill="#8B5CF6"/>
  <rect x="980" y="510" width="12" height="80" rx="2" fill="#38BDF8"/>
  <rect x="1000" y="525" width="12" height="65" rx="2" fill="#38BDF8"/>
  <rect x="1020" y="500" width="12" height="90" rx="2" fill="#4ADE80"/>
  <text x="900" y="615" font-family="'JetBrains Mono', monospace" font-size="9" fill="rgba(255,255,255,0.4)">SOCKET TRAFFIC SPECTRUM</text>
</svg>
