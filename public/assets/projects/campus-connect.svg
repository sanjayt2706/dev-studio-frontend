<svg width="1200" height="750" viewBox="0 0 1200 750" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="750" fill="#0A0B10"/>
  <defs>
    <radialGradient id="cc-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3B82F6" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#0A0B10" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cc-line" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>
  <!-- Background Glow -->
  <circle cx="600" cy="375" r="400" fill="url(#cc-glow)"/>
  
  <!-- Subtle Grid -->
  <g stroke="rgba(255,255,255,0.04)" stroke-width="1">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="600" x2="1200" y2="600"/>
    <line x1="200" y1="0" x2="200" y2="750"/>
    <line x1="400" y1="0" x2="400" y2="750"/>
    <line x1="600" y1="0" x2="600" y2="750"/>
    <line x1="800" y1="0" x2="800" y2="750"/>
    <line x1="1000" y1="0" x2="1000" y2="750"/>
  </g>

  <!-- Technical Window Frame -->
  <rect x="80" y="70" width="1040" height="610" rx="12" fill="#10121A" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>
  
  <!-- Window Header -->
  <rect x="80" y="70" width="1040" height="48" rx="12" fill="#151822"/>
  <circle cx="115" cy="94" r="6" fill="#EF4444" opacity="0.8"/>
  <circle cx="135" cy="94" r="6" fill="#F59E0B" opacity="0.8"/>
  <circle cx="155" cy="94" r="6" fill="#10B981" opacity="0.8"/>
  <text x="600" y="99" font-family="'JetBrains Mono', monospace" font-size="12" fill="rgba(255,255,255,0.5)" text-anchor="middle" letter-spacing="2">CAMPUS_CONNECT // WEBSOCKET_NETWORK_v2.4</text>
  <rect x="1010" y="85" width="80" height="18" rx="9" fill="#22C55E" fill-opacity="0.15"/>
  <text x="1050" y="98" font-family="'JetBrains Mono', monospace" font-size="9" fill="#4ADE80" text-anchor="middle" font-weight="700">● LIVE_FEED</text>

  <!-- Left Sidebar / Channels -->
  <rect x="100" y="140" width="220" height="510" rx="8" fill="#131620" stroke="rgba(255,255,255,0.05)"/>
  <text x="120" y="175" font-family="'JetBrains Mono', monospace" font-size="11" fill="#60A5FA" font-weight="700" letter-spacing="1">COMMUNITY CHANNELS</text>
  <rect x="120" y="195" width="180" height="32" rx="6" fill="rgba(59,130,246,0.15)"/>
  <text x="135" y="216" font-family="'JetBrains Mono', monospace" font-size="11" fill="#93C5FD"># general-announcements</text>
  <text x="135" y="255" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.4)"># hackathon-prep</text>
  <text x="135" y="295" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.4)"># dev-sprints</text>
  <text x="135" y="335" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.4)"># ai-research-lab</text>
  <text x="135" y="375" font-family="'JetBrains Mono', monospace" font-size="11" fill="rgba(255,255,255,0.4)"># club-projects</text>

