<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="gal-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a17"/>
      <stop offset="50%" stop-color="#151226"/>
      <stop offset="100%" stop-color="#07060d"/>
    </linearGradient>
    <radialGradient id="gal-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ec4899" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#8b5cf6" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="600" fill="url(#gal-bg)"/>
  <circle cx="400" cy="300" r="300" fill="url(#gal-glow)"/>

  <!-- Matrix Grid -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="450" x2="800" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="600"/>
    <line x1="400" y1="0" x2="400" y2="600"/>
    <line x1="600" y1="0" x2="600" y2="600"/>
  </g>

  <!-- Camera Aperture & Focus Graphic -->
  <g transform="translate(400, 280)">
    <circle r="120" fill="none" stroke="#ec4899" stroke-opacity="0.3" stroke-width="2" stroke-dasharray="10 6"/>
    <circle r="90" fill="#1e152e" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="2"/>
    <circle r="40" fill="none" stroke="#ec4899" stroke-width="3"/>
    
    <!-- Focus Brackets -->
    <path d="M-150,-100 L-130,-100 L-130,-80" fill="none" stroke="#f472b6" stroke-width="3"/>
    <path d="M150,-100 L130,-100 L130,-80" fill="none" stroke="#f472b6" stroke-width="3"/>
    <path d="M-150,100 L-130,100 L-130,80" fill="none" stroke="#f472b6" stroke-width="3"/>
    <path d="M150,100 L130,100 L130,80" fill="none" stroke="#f472b6" stroke-width="3"/>
  </g>

  <!-- Branded Badge -->
  <g transform="translate(400, 480)">
    <rect x="-130" y="-18" width="260" height="36" rx="6" fill="#201533" stroke="#ec4899" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="-100" cy="0" r="4" fill="#ec4899"/>
    <text x="10" y="5" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" font-weight="bold" fill="#f472b6" text-anchor="middle" letter-spacing="3">DEV STUDIO ARCHIVE</text>
  </g>
</svg>
