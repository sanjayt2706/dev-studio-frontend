<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1000" viewBox="0 0 800 1000">
  <defs>
    <linearGradient id="ev-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c1b"/>
      <stop offset="50%" stop-color="#181329"/>
      <stop offset="100%" stop-color="#090712"/>
    </linearGradient>
    <radialGradient id="ev-glow" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.3"/>
      <stop offset="50%" stop-color="#8b5cf6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Background Base -->
  <rect width="800" height="1000" fill="url(#ev-bg)"/>
  <circle cx="400" cy="450" r="450" fill="url(#ev-glow)"/>

  <!-- Geometric Grid -->
  <g stroke="#ffffff" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="0" y1="600" x2="800" y2="600"/>
    <line x1="0" y1="800" x2="800" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="1000"/>
    <line x1="400" y1="0" x2="400" y2="1000"/>
    <line x1="600" y1="0" x2="600" y2="1000"/>
  </g>

  <!-- Central Event Beacon & Radar Rings -->
  <g transform="translate(400, 440)">
    <circle r="180" fill="none" stroke="#f59e0b" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="8 6"/>
    <circle r="140" fill="none" stroke="#8b5cf6" stroke-opacity="0.3" stroke-width="2"/>
    <circle r="100" fill="#1b162e" stroke="#f59e0b" stroke-opacity="0.5" stroke-width="2"/>

    <!-- Calendar Icon Graphic -->
    <rect x="-35" y="-30" width="70" height="60" rx="8" fill="none" stroke="#fbbf24" stroke-width="3"/>
    <line x1="-35" y1="-10" x2="35" y2="-10" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="-16" cy="-40" r="4" fill="#fbbf24"/>
    <circle cx="16" cy="-40" r="4" fill="#fbbf24"/>
    
    <!-- Pulse Dots -->
    <circle cx="-12" cy="5" r="4" fill="#fbbf24" opacity="0.8"/>
    <circle cx="12" cy="5" r="4" fill="#fbbf24" opacity="0.8"/>
    <circle cx="-12" cy="18" r="4" fill="#fbbf24" opacity="0.8"/>
    <circle cx="12" cy="18" r="4" fill="#fbbf24" opacity="0.8"/>
  </g>

  <!-- Top Badge -->
  <g transform="translate(400, 140)">
    <rect x="-110" y="-18" width="220" height="36" rx="6" fill="#241a3d" stroke="#8b5cf6" stroke-opacity="0.5" stroke-width="1"/>
    <text x="0" y="5" font-family="'JetBrains Mono', monospace, sans-serif" font-size="11" font-weight="bold" fill="#c084fc" text-anchor="middle" letter-spacing="3">DEV STUDIO EVENT</text>
  </g>

  <!-- Bottom Date / Status Label -->
  <g transform="translate(400, 800)">
    <rect x="-160" y="-24" width="320" height="48" rx="8" fill="#19132e" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1"/>
    <circle cx="-120" cy="0" r="4" fill="#f59e0b"/>
    <text x="5" y="6" font-family="'JetBrains Mono', monospace, sans-serif" font-size="13" font-weight="bold" fill="#fbbf24" text-anchor="middle" letter-spacing="3">SCHEDULED EXPERIENCE</text>
  </g>
</svg>
